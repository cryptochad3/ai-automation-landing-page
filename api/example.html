<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image API Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 30px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            background: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .status {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .status h3 {
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .image-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        
        .image-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        
        .image-info {
            padding: 15px;
        }
        
        .image-info h3 {
            margin-bottom: 8px;
            color: #333;
        }
        
        .image-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .image-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .image-actions button {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 20px;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            color: #667eea;
            margin: 0;
        }
        
        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 28px;
        }
        
        .close:hover {
            color: #000;
        }
        
        .modal-body p {
            margin: 10px 0;
            color: #333;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Image API Demo</h1>
        <p class="subtitle">FastAPI image server similar to Unsplash</p>
        
        <div class="controls">
            <button onclick="loadAllImages()">📋 Load All Images</button>
            <button onclick="loadRandomImage()">🎲 Random Image</button>
            <button onclick="checkHealth()">❤️ Health Check</button>
            <button onclick="clearGallery()">🗑️ Clear Gallery</button>
        </div>
        
        <div id="status"></div>
        <div id="error"></div>
        <div id="gallery" class="gallery"></div>
    </div>
    
    <!-- Modal for image info -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Image Information</h2>
                <button class="close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        function showStatus(message) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `
                <div class="status">
                    <h3>Status</h3>
                    <p>${message}</p>
                </div>
            `;
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
            setTimeout(() => {
                errorDiv.innerHTML = '';
            }, 5000);
        }
        
        function clearGallery() {
            document.getElementById('gallery').innerHTML = '';
            document.getElementById('status').innerHTML = '';
        }
        
        function createImageCard(image) {
            return `
                <div class="image-card">
                    <img src="${image.download_url}" alt="${image.filename}">
                    <div class="image-info">
                        <h3>${image.filename}</h3>
                        <p>📏 Dimensions: ${image.width} × ${image.height}</p>
                        <p>💾 Size: ${(image.size / 1024).toFixed(2)} KB</p>
                        <p>📄 Format: ${image.format}</p>
                        <p>🆔 ID: ${image.id}</p>
                        <div class="image-actions">
                            <button onclick="viewImageInfo('${image.id}')">ℹ️ Info</button>
                            <button onclick="downloadImage('${image.id}', '${image.filename}')">⬇️ Download</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        async function loadAllImages() {
            clearGallery();
            showStatus('Loading all images...');
            
            try {
                const response = await fetch(`${API_BASE}/api/images`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                showStatus(`Found ${data.total} images`);
                
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = data.images.map(createImageCard).join('');
            } catch (error) {
                showError(`Failed to load images: ${error.message}`);
            }
        }
        
        async function loadRandomImage() {
            clearGallery();
            showStatus('Loading random image...');
            
            try {
                const response = await fetch(`${API_BASE}/api/images/random`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const image = await response.json();
                showStatus('Random image loaded');
                
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = createImageCard(image);
            } catch (error) {
                showError(`Failed to load random image: ${error.message}`);
            }
        }
        
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
        
        function showModal(content) {
            const modal = document.getElementById('imageModal');
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = content;
            modal.style.display = 'block';
        }
        
        async function viewImageInfo(imageId) {
            try {
                const response = await fetch(`${API_BASE}/api/images/${imageId}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const image = await response.json();
                const content = `
                    <p><strong>🆔 ID:</strong> ${image.id}</p>
                    <p><strong>📄 Filename:</strong> ${image.filename}</p>
                    <p><strong>📏 Dimensions:</strong> ${image.width} × ${image.height}</p>
                    <p><strong>💾 Size:</strong> ${(image.size / 1024).toFixed(2)} KB</p>
                    <p><strong>🎨 Format:</strong> ${image.format}</p>
                    <p><strong>📅 Created:</strong> ${new Date(image.created_at).toLocaleString()}</p>
                    <p><strong>🔗 URL:</strong> <code>${image.url}</code></p>
                `;
                showModal(content);
            } catch (error) {
                showError(`Failed to get image info: ${error.message}`);
            }
        }
        
        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target === modal) {
                closeModal();
            }
        }
        
        async function downloadImage(imageId, filename) {
            try {
                const response = await fetch(`${API_BASE}/api/images/${imageId}/download`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showStatus(`Downloaded: ${filename}`);
            } catch (error) {
                showError(`Failed to download image: ${error.message}`);
            }
        }
        
        async function checkHealth() {
            showStatus('Checking API health...');
            
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const health = await response.json();
                showStatus(`
                    API Status: ${health.status.toUpperCase()}<br>
                    Images Available: ${health.images_available}<br>
                    Directory: ${health.images_directory}
                `);
            } catch (error) {
                showError(`Health check failed: ${error.message}`);
            }
        }
        
        // Load all images on page load
        window.addEventListener('load', loadAllImages);
    </script>
</body>
</html>
